# XrayR-style: ./config on the host is mounted to /etc/xboard-node in the container.
# Run all commands from this directory: cd compose && docker compose up -d
# See README.md in this folder.

# A fixed project name: compose otherwise names the project after this
# directory, and an upstream xboard-node checkout gets the same name, so
# `docker compose up` in one would replace the other's container.
name: cp-node

services:
  cp-node:
    image: ghcr.io/oballm/xboard-node:latest
    container_name: cp-node
    network_mode: host
    restart: unless-stopped
    volumes:
      # Config, TLS certificates and kernel cache. Keep it: without it every
      # container recreate requests new certificates.
      - ./config:/etc/xboard-node
      # Versions installed by a panel-requested upgrade (XBOARD_NODE_UPDATE_DIR
      # in the image). Without a volume here, such upgrades are refused.
      - cp-node-update:/var/lib/xboard-node
    command: ["-c", "/etc/xboard-node/config.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: override panel settings without editing config.yml (still need a valid config file to load).
    # environment:
    #   API_HOST: https://panel.example.com
    #   API_KEY: your-server-token
    #   NODE_ID: "1"
    #   KERNEL_TYPE: singbox

volumes:
  cp-node-update: {}
